name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -o nexrabot ./cmd/nexrabot && ./nexrabot version
      - name: Installer syntax
        run: bash -n install.sh
