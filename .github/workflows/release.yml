name: Release

# Push a tag like v6.0.0 (or publish a release) to build:
#   nexrabot-linux-amd64 / nexrabot-linux-arm64  — the bot, used by install.sh
#   nexra-autopay.apk                              — the auto-confirm phone app,
#                                                    which Nexra Panel can fetch
#
# Or run it by hand (Actions → Release → Run workflow) on any branch with a
# tag like v6.0.0-beta.1: that publishes a pre-release from that branch, for
# testing before main. Use it with: RELEASE=v6.0.0-beta.1 bash install.sh …
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pre-release tag to create, e.g. v6.0.0-beta.1 (empty = build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/nexrabot-linux-$arch ./cmd/nexrabot
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bot
          path: dist/

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/nexra-autopay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

  release:
    needs: [bot, apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cp install.sh dist/
          cd dist && sha256sum nexrabot-linux-* nexra-autopay.apk install.sh > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # a hand-run release is a pre-release made from the branch it ran on
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.tag != '' || contains(github.ref_name, '-') }}
